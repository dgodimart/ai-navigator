<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:13px">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
    <div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="flex:none;width:210px;font-size:12px;color:#231F20;line-height:1.3;text-wrap:pretty">{{ r.label }}</span>
        <div style="flex:1;background:#EDF1F4;height:11px;border-radius:999px;overflow:hidden"><div style="{{ r.barStyle }}"></div></div>
        <span style="font-size:12px;color:#231F20;font-weight:700;width:32px;text-align:right">xx%</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string;w:number}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rows = this.props.rows || [];
    return {
      rows: rows.map(function (r) {
        return { label: r.label, barStyle: 'height:100%;width:' + (r.w || 50) + '%;background:' + (r.color || '#086C94') + ';border-radius:999px' };
      })
    };
  }
}
</script>
</body>
</html>
