# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Static site, no build step: site/ is committed prebuilt, so Render only has
# to publish it. Rebuilding is a local step (python tools/unbundle.py), which
# keeps the deploy path free of any dependency on Python being present in
# Render's build image.
services:
  - type: web
    runtime: static
    name: thoughtlab-ai-city-navigator
    staticPublishPath: ./site

    headers:
      # Asset filenames carry a content hash, so a changed file is always a
      # changed URL and a year-long immutable cache is safe.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # index.html must not be cached, or clients keep resolving old asset
      # hashes after a deploy.
      - path: /*
        name: Cache-Control
        value: no-cache

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# No routes/rewrites: navigation is internal component state rather than URL
# routing, so there is only ever the one document to serve.
